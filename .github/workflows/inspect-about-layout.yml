name: Inspect current layout for About addition
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-about-layout.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read current structure without embedded images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          s = re.sub(r'data:image/[^\s\"\x27<>]+', '[EMBEDDED_IMAGE]', s)
          Path('.github/about-layout.txt').write_text(s, encoding='utf-8')
          print('Layout report characters:', len(s))
          PY
      - name: Save layout inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/about-layout.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record current layout for a minimal About addition"
          git push
