name: Add About section and align navigation only
on:
  push:
    branches: [main]
    paths:
      - .github/add-about-minimal.py
      - .github/workflows/add-about-minimal.yml
permissions:
  contents: write
jobs:
  add-about:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply minimal checked update
        run: python3 .github/add-about-minimal.py
      - name: Save update and remove temporary report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if test -f .github/about-layout.txt; then git rm .github/about-layout.txt; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Hakkımızda ekle ve bölüm sırasını düzenle; diğer içerikleri koru"
          git push
