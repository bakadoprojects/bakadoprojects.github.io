name: Update BAKADO website branding

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-public-upload.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Apply gallery and Google branding updates
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          html = html.replace(
              'Eklediğiniz fotoğraflar bu cihazdaki tarayıcıda saklanır. Diğer ziyaretçilerin görebilmesi için fotoğrafları daha sonra site dosyasına veya ücretsiz bulut depolamaya eklememiz gerekir.',
              'Bu alanda BAKADO tarafından seçilen ortak proje fotoğrafları yer alır.'
          )

          start = html.find('      <div class="uploader">')
          end = html.find('      <div id="gallery"', start)
          if start != -1 and end != -1:
              html = html[:start] + html[end:]

          start = html.find('<script id="partners-gallery-script">')
          end = html.find('</script>', start)
          if start != -1 and end != -1:
              html = html[:start] + html[end + len('</script>'):]

          html = html.replace(
              'Henüz fotoğraf eklenmedi.',
              'Seçili proje fotoğrafları yakında burada yer alacak.'
          )

          start_marker = '<!-- BAKADO-SEARCH-BRAND-START -->'
          end_marker = '<!-- BAKADO-SEARCH-BRAND-END -->'
          if start_marker in html and end_marker in html:
              before, rest = html.split(start_marker, 1)
              _, after = rest.split(end_marker, 1)
              html = before + after

          brand = '''<!-- BAKADO-SEARCH-BRAND-START -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
<link rel="shortcut icon" href="/favicon.svg" type="image/svg+xml">
<meta name="application-name" content="BAKADO">
<meta property="og:site_name" content="BAKADO">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "BAKADO",
  "alternateName": ["BAKADO Mobilya", "BAKADO Projects"],
  "url": "https://bakadoprojects.github.io/"
}
</script>
<!-- BAKADO-SEARCH-BRAND-END -->
'''
          if '</head>' not in html:
              raise SystemExit('index.html içinde head kapanışı bulunamadı')
          html = html.replace('</head>', brand + '</head>', 1)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit site update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Değişiklik gerekmedi"
            exit 0
          fi
          git add index.html
          git commit -m "BAKADO Google site adı ve marka ikonunu ekle"
          git push
