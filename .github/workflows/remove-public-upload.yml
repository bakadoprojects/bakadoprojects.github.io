name: Remove public photo upload

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-public-upload.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Remove visitor upload controls
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          html = html.replace(
              'Eklediğiniz fotoğraflar bu cihazdaki tarayıcıda saklanır. Diğer ziyaretçilerin görebilmesi için fotoğrafları daha sonra site dosyasına veya ücretsiz bulut depolamaya eklememiz gerekir.',
              'Bu alanda BAKADO tarafından seçilen ortak proje fotoğrafları yer alır.'
          )

          start = html.find('      <div class="uploader">')
          end = html.find('      <div id="gallery"', start)
          if start == -1 or end == -1:
              raise SystemExit('Beklenen ziyaretçi yükleme alanı bulunamadı')
          html = html[:start] + html[end:]

          start = html.find('<script id="partners-gallery-script">')
          end = html.find('</script>', start)
          if start == -1 or end == -1:
              raise SystemExit('Beklenen galeri betiği bulunamadı')
          html = html[:start] + html[end + len('</script>'):]

          html = html.replace(
              'Henüz fotoğraf eklenmedi.',
              'Seçili proje fotoğrafları yakında burada yer alacak.'
          )
          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit site update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Değişiklik gerekmedi"
            exit 0
          fi
          git add index.html
          git commit -m "Ziyaretçi fotoğraf yüklemesini kaldır"
          git push
