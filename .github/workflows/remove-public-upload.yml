name: Update BAKADO website branding

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-public-upload.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Apply BAKADO Google branding
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          start_marker = '<!-- BAKADO-SEARCH-BRAND-START -->'
          end_marker = '<!-- BAKADO-SEARCH-BRAND-END -->'

          if start_marker in html and end_marker in html:
              before, rest = html.split(start_marker, 1)
              _, after = rest.split(end_marker, 1)
              html = before + after

          brand_lines = [
              start_marker,
              '<link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">',
              '<link rel="shortcut icon" href="/favicon.svg" type="image/svg+xml">',
              '<meta name="application-name" content="BAKADO">',
              '<meta property="og:site_name" content="BAKADO">',
              '<script type="application/ld+json">',
              '{"@context":"https://schema.org","@type":"WebSite","name":"BAKADO","alternateName":["BAKADO Mobilya","BAKADO Projects"],"url":"https://bakadoprojects.github.io/"}',
              '</script>',
              end_marker,
          ]
          brand = '\n'.join(brand_lines) + '\n'
          if '</head>' not in html:
              raise SystemExit('index.html içinde head kapanışı bulunamadı')
          html = html.replace('</head>', brand + '</head>', 1)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit site update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Değişiklik gerekmedi"
            exit 0
          fi
          git add index.html
          git commit -m "BAKADO Google site adı ve marka ikonunu ekle"
          git push
